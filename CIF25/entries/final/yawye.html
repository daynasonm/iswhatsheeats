<script>
// Grab all orbit tracks
const tracks = document.querySelectorAll('.track');

tracks.forEach(track => {
  if (!track.dataset.speed) track.dataset.speed = 50;
  if (!track.dataset.angle) track.dataset.angle = 0;
});

function animate(time) {
  tracks.forEach(track => {
    const speed = Number(track.dataset.speed);
    const start = Number(track.dataset.angle);
    const degPerMs = 360 / (speed * 1000);
    const angle = start + time * degPerMs;

    track.style.transform =
      `translate(-50%, -50%) rotate(${angle}deg)`;
  });

  requestAnimationFrame(animate);
}

requestAnimationFrame(animate);
</script>
